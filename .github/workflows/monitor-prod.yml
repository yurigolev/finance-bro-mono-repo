name: Monitor FinanceBro production

on:
  schedule:
    - cron: '7,17,27,37,47,57 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: financebro-prod-external-check
  cancel-in-progress: false

jobs:
  check:
    if: github.ref == 'refs/heads/main' && vars.FINANCEBRO_MONITORING_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check live production HTTPS and certificate lifetime
        env:
          HEALTHCHECKS_PROD_HTTPS_URL: ${{ secrets.HEALTHCHECKS_PROD_HTTPS_URL }}
          HEALTHCHECKS_PROD_TLS_WARNING_URL: ${{ secrets.HEALTHCHECKS_PROD_TLS_WARNING_URL }}
          HEALTHCHECKS_PROD_TLS_CRITICAL_URL: ${{ secrets.HEALTHCHECKS_PROD_TLS_CRITICAL_URL }}
        run: python3 scripts/monitor-financebro-prod.py
