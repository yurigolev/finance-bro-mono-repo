name: CI

on:
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  lint-and-format:
    name: Lint and formatting
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source code
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install lint and formatting tools
        env:
          HUSKY: '0'
        run: npm ci
      - name: Run ESLint
        run: npm run lint
      - name: Check formatting with Prettier
        run: npm run format:check

  backend:
    name: Backend checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: financebro
          POSTGRES_USER: financebro
          POSTGRES_PASSWORD: financebro_ci
        ports:
          - '5432:5432'
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U financebro -d financebro"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://financebro:financebro_ci@127.0.0.1:5432/financebro
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out source code
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install backend dependencies
        run: npm ci
      - name: Typecheck backend
        run: npm run typecheck
      - name: Install FFmpeg for audio tests
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Apply migrations to test database
        run: npm run db:migrate
      - name: Run backend tests and database-backed budget tests
        run: BUDGET_TEST_DATABASE_URL="$DATABASE_URL" npm test
      - name: Run integration and migration tests
        run: MIGRATION_TEST_DATABASE_URL="$DATABASE_URL" npm run test:integration

  mini-app:
    name: Mini App checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mini-app
    steps:
      - name: Check out source code
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: mini-app/package-lock.json
      - name: Install Mini App dependencies
        run: npm ci
      - name: Typecheck Mini App
        run: npm run typecheck
      - name: Build Mini App
        run: npm run generate

  required:
    name: CI required
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    needs: [lint-and-format, backend, mini-app]
    if: ${{ always() }}
    steps:
      - name: Require all checks to pass
        env:
          LINT_RESULT: ${{ needs.lint-and-format.result }}
          BACKEND_RESULT: ${{ needs.backend.result }}
          MINI_APP_RESULT: ${{ needs.mini-app.result }}
        run: |
          printf 'Lint and formatting: %s\nBackend: %s\nMini App: %s\n' "$LINT_RESULT" "$BACKEND_RESULT" "$MINI_APP_RESULT"
          test "$LINT_RESULT" = success && test "$BACKEND_RESULT" = success && test "$MINI_APP_RESULT" = success
