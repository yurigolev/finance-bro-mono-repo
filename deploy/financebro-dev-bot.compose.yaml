services:
  bot:
    container_name: financebro-dev-bot
    image: ${BOT_IMAGE:?}
    environment:
      BOT_TOKEN: ${BOT_TOKEN:?}
      CORE_URL: http://core:8787
      CORE_SERVICE_TOKEN: ${CORE_SERVICE_TOKEN:?}
      INPUT_URL: http://input:8788
      INPUT_SERVICE_TOKEN: ${INPUT_SERVICE_TOKEN:?}
    networks: [frontend, bot-egress, input-api]
    stop_grace_period: 90s
    init: true
    restart: unless-stopped
  telegram-relay:
    container_name: financebro-dev-telegram-relay
    image: ${BOT_IMAGE:?}
    user: '19797:19797'
    entrypoint: [node, /telegram-relay.mjs]
    command: [bridge]
    read_only: true
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    sysctls:
      net.ipv4.ip_unprivileged_port_start: '443'
    volumes:
      - ./telegram-relay.mjs:/telegram-relay.mjs:ro
      - ./telegram-socket:/telegram-socket:ro
    networks:
      bot-egress:
        aliases: [api.telegram.org]
    restart: unless-stopped
  input:
    container_name: financebro-dev-input
    image: ${INPUT_IMAGE:?}
    environment:
      INPUT_SERVICE_TOKEN: ${INPUT_SERVICE_TOKEN:?}
      INPUT_HTTP_HOST: 0.0.0.0
      INPUT_HTTP_PORT: '8788'
      WHISPER_URL: http://whisper:8080/inference
    networks: [input-api, speech]
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:8788/health', {signal: AbortSignal.timeout(1500)}).then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))",
        ]
      interval: 2s
      timeout: 3s
      retries: 20
    tmpfs: [/tmp]
    init: true
    restart: unless-stopped
  whisper:
    container_name: financebro-dev-whisper
    cpus: 0.75
    mem_limit: 1g
    image: ${WHISPER_IMAGE:?}
    command:
      [
        '--host',
        '0.0.0.0',
        '--model',
        '/models/ggml-base.bin',
        '--language',
        'ru',
        '--threads',
        '1',
        '--audio-ctx',
        '1024',
        '--no-gpu',
        '--convert',
        '--tmp-dir',
        '/tmp',
      ]
    networks: [speech]
    volumes: [./models:/models:ro]
    tmpfs: [/tmp]
    healthcheck:
      test: [CMD, curl, -fsS, 'http://localhost:8080/health']
      interval: 10s
      timeout: 3s
      start_period: 30s
      retries: 6
    restart: unless-stopped
networks:
  input-api:
    internal: true
  speech:
    internal: true
  bot-egress: {}
