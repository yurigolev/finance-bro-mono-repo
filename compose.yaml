name: financebro

services:
  db:
    container_name: ${COMPOSE_PROJECT_NAME}-postgres
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: financebro
      POSTGRES_DB: financebro
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql
    networks: [database]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U financebro -d financebro"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  migrate:
    container_name: ${COMPOSE_PROJECT_NAME}-db-migrate
    build:
      context: ./backend
      target: migrate
    command: ["npm", "run", "db:migrate"]
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env}
    networks: [database]
    depends_on:
      db:
        condition: service_healthy

  core:
    container_name: ${COMPOSE_PROJECT_NAME}-financial-core
    build:
      context: ./backend
      target: core-runtime
    environment:
      BOT_TOKEN: ${BOT_TOKEN:-}
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env}
      CORE_SERVICE_TOKEN: ${CORE_SERVICE_TOKEN:?set CORE_SERVICE_TOKEN in .env}
      ANALYTICS_HTTP_HOST: 0.0.0.0
      ANALYTICS_HTTP_PORT: ${ANALYTICS_HTTP_PORT:-8787}
      ANALYTICS_INIT_DATA_MAX_AGE_SECONDS: ${ANALYTICS_INIT_DATA_MAX_AGE_SECONDS:-3600}
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks: [database, backend, frontend]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:' + process.env.ANALYTICS_HTTP_PORT + '/api/analytics/overview', {signal: AbortSignal.timeout(1500)}).then(r => process.exit(r.status === 401 ? 0 : 1), () => process.exit(1))"]
      interval: 2s
      timeout: 3s
      retries: 20
    init: true
    restart: unless-stopped

  bot:
    container_name: ${COMPOSE_PROJECT_NAME}-telegram-bot
    build:
      context: ./backend
      target: bot-runtime
    environment:
      BOT_TOKEN: ${BOT_TOKEN:-}
      CORE_URL: http://core:${ANALYTICS_HTTP_PORT:-8787}
      CORE_SERVICE_TOKEN: ${CORE_SERVICE_TOKEN:?set CORE_SERVICE_TOKEN in .env}
      INPUT_URL: http://input:8788
      INPUT_SERVICE_TOKEN: ${INPUT_SERVICE_TOKEN:?set INPUT_SERVICE_TOKEN in .env}
    depends_on:
      core:
        condition: service_healthy
      input:
        condition: service_healthy
    networks: [backend, input-api, telegram]
    stop_grace_period: 90s
    init: true
    restart: unless-stopped

  input:
    container_name: ${COMPOSE_PROJECT_NAME}-input-parser
    build:
      context: ./backend
      target: input-runtime
    environment:
      INPUT_SERVICE_TOKEN: ${INPUT_SERVICE_TOKEN:?set INPUT_SERVICE_TOKEN in .env}
      INPUT_CLIENT_TOKENS: ${INPUT_CLIENT_TOKENS:-}
      INPUT_HTTP_HOST: 0.0.0.0
      INPUT_HTTP_PORT: 8788
      WHISPER_URL: http://whisper:8080/inference
    networks: [input-api, speech]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:' + process.env.INPUT_HTTP_PORT + '/health', {signal: AbortSignal.timeout(1500)}).then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 2s
      timeout: 3s
      retries: 20
    tmpfs:
      - /tmp
    init: true
    restart: unless-stopped

  whisper-model:
    container_name: ${COMPOSE_PROJECT_NAME}-whisper-model
    build:
      context: ./backend
      dockerfile: Dockerfile.whisper
      target: download
    command:
      - sh
      - -ec
      - |
        digest=1be3a9b2063867b937e64e2ec7483364a79917e157fa98c5d94b5c1fffea987b
        cd /models
        if echo "$$digest  ggml-small.bin" | sha256sum -c --status; then exit 0; fi
        curl -fsSL --retry 3 --max-time 600 -o ggml-small.bin.part \
          https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-small.bin
        echo "$$digest  ggml-small.bin.part" | sha256sum -c -
        mv ggml-small.bin.part ggml-small.bin
    networks: [model-download]
    volumes:
      - whisper-model:/models

  whisper:
    container_name: ${COMPOSE_PROJECT_NAME}-whisper
    build:
      context: ./backend
      dockerfile: Dockerfile.whisper
    command: ["--host", "0.0.0.0", "--model", "/models/ggml-small.bin", "--language", "ru", "--threads", "${WHISPER_THREADS:-2}", "--no-gpu", "--convert", "--tmp-dir", "/tmp"]
    depends_on:
      whisper-model:
        condition: service_completed_successfully
    networks: [speech]
    volumes:
      - whisper-model:/models:ro
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      start_period: 30s
      retries: 6
    restart: unless-stopped

  mini-app:
    container_name: ${COMPOSE_PROJECT_NAME}-mini-app
    profiles: [mini-app]
    build: ./mini-app
    environment:
      ANALYTICS_LISTEN: '80'
      ANALYTICS_API_UPSTREAM: core:${ANALYTICS_HTTP_PORT:-8787}
      ANALYTICS_STATIC_ROOT: /usr/share/nginx/html
      ANALYTICS_DNS_DIRECTIVE: resolver 127.0.0.11 valid=10s ipv6=off;
      NGINX_ENVSUBST_FILTER: ^ANALYTICS_
    ports:
      - '127.0.0.1:${MINI_APP_PORT:-8081}:80'
    depends_on:
      core:
        condition: service_healthy
    networks: [frontend]
    restart: unless-stopped

networks:
  database:
    internal: true
  backend:
    internal: true
  input-api:
    internal: true
  telegram:
  speech:
    internal: true
  model-download:
  frontend:

volumes:
  postgres-data:
  whisper-model:
