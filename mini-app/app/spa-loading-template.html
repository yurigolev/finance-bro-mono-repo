<style>
  .startup-screen {
    position: fixed;
    inset: 0;
    z-index: 1000;
    display: grid;
    place-items: center;
    box-sizing: border-box;
    padding: 0 16px 32px;
    background: var(--telegram-app-background, var(--startup-background));
    color: var(--tg-theme-text-color, var(--startup-text));
    color-scheme: var(--tg-color-scheme, light dark);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    text-align: center;
  }

  .startup-content {
    display: grid;
    justify-items: center;
  }

  .startup-chart {
    display: flex;
    align-items: end;
    justify-content: center;
    gap: 5px;
    box-sizing: border-box;
    width: 78px;
    height: 76px;
    margin-bottom: 20px;
    padding-bottom: 14px;
    border-radius: 20px;
    background: #d4e8f9;
    background: light-dark(#d4e8f9, #2b4357);
  }

  .startup-chart span {
    width: 13px;
    border-radius: 5px;
    transform-origin: bottom;
  }

  .startup-chart span:nth-child(1) {
    height: 24px;
    background: #3589cb;
    background: light-dark(#3589cb, #66b8f2);
  }

  .startup-chart span:nth-child(2) {
    height: 21px;
    background: #e76c70;
    background: light-dark(#e76c70, #f28085);
  }

  .startup-chart span:nth-child(3) {
    height: 39px;
    background: #166eaf;
    background: light-dark(#166eaf, #8ac8fa);
  }

  .startup-name {
    font-size: 32px;
    font-weight: 700;
    line-height: 1.15;
  }

  @media (prefers-reduced-motion: no-preference) {
    .startup-chart span {
      animation: startup-chart-pulse 1.2s ease-in-out infinite;
    }

    .startup-chart span:nth-child(2) {
      animation-delay: 120ms;
    }

    .startup-chart span:nth-child(3) {
      animation-delay: 240ms;
    }

    @keyframes startup-chart-pulse {
      0%,
      100% {
        transform: scaleY(1);
      }

      50% {
        transform: scaleY(0.45);
      }
    }
  }
</style>

<div class="startup-screen">
  <div class="startup-content" role="status" aria-label="Открываем FinanceBro">
    <div class="startup-chart" aria-hidden="true"><span></span><span></span><span></span></div>
    <div class="startup-name">FinanceBro</div>
  </div>
</div>
